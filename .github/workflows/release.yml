name: Release GitHub Action container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'The vMAJOR.MINOR.PATCH Action version to release'
        required: true

env:
  IMAGE_NAME: ievangelist/profanity-filter
  # The base image is now inferred by the .NET SDK.
  # https://github.com/dotnet/dotnet-docker/blob/nightly/README.runtime-deps.md#full-tag-listing
  # BASE_IMAGE: mcr.microsoft.com/dotnet/nightly/runtime-deps:9.0.0-noble-chiseled-aot

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: 🏷️ Derive Action release aliases
        id: aliases
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "major=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "is-stable-semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping Action aliases: '$RELEASE_VERSION' is not a stable vMAJOR.MINOR.PATCH version."
            echo "is-stable-semver=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Get the version
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: echo "RELEASE_VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: 🏷️ Get the version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: 💜 Setup .NET
        uses: actions/setup-dotnet@main

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Publish app
        working-directory: ./src/ProfanityFilter.Action
        run: |
          dotnet publish \
            /t:PublishContainer \
            -p DebugType=none \
            -p ContainerRegistry=ghcr.io \
            -p ContainerImageTags='"latest;${{ env.RELEASE_VERSION }}"' \
            -p ContainerRepository=${{ env.IMAGE_NAME }} \
            -bl

      - name: 🔖 Update Action release aliases
        if: steps.aliases.outputs.is-stable-semver == 'true'
        env:
          MAJOR_ALIAS: ${{ steps.aliases.outputs.major }}
          MINOR_ALIAS: ${{ steps.aliases.outputs.minor }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --force --annotate "$MAJOR_ALIAS" --message "Update $MAJOR_ALIAS Action release alias"
          git tag --force --annotate "$MINOR_ALIAS" --message "Update $MINOR_ALIAS Action release alias"
          git push --force origin "refs/tags/$MAJOR_ALIAS" "refs/tags/$MINOR_ALIAS"

      - name: 📦 Upload build log
        uses: actions/upload-artifact@main
        if: always()
        with:
          name: msbuild.binlog
          path: src/ProfanityFilter.Action/msbuild.binlog