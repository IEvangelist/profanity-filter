name: Release GitHub Action container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'The vMAJOR.MINOR.PATCH Action version to release'
        required: true

env:
  IMAGE_NAME: ievangelist/profanity-filter
  # The base image is now inferred by the .NET SDK.
  # https://github.com/dotnet/dotnet-docker/blob/nightly/README.runtime-deps.md#full-tag-listing
  # BASE_IMAGE: mcr.microsoft.com/dotnet/nightly/runtime-deps:9.0.0-noble-chiseled-aot

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.aliases.outputs.version }}
      major: ${{ steps.aliases.outputs.major }}
      minor: ${{ steps.aliases.outputs.minor }}
      is-stable-semver: ${{ steps.aliases.outputs.is-stable-semver }}

    steps:
      - name: 🏷️ Derive Action release aliases
        id: aliases
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "major=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "is-stable-semver=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Action releases must use a stable vMAJOR.MINOR.PATCH version; received '$RELEASE_VERSION'."
              exit 1
            fi
            echo "::warning::Skipping Action aliases: '$RELEASE_VERSION' is not a stable vMAJOR.MINOR.PATCH version."
            echo "is-stable-semver=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Check out the repo
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: 🏷️ Get the version
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: echo "RELEASE_VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: 🏷️ Get the version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: 💜 Setup .NET
        uses: actions/setup-dotnet@main
        with:
          global-json-file: ./global.json

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Publish app
        working-directory: ./src/ProfanityFilter.Action
        run: |
          dotnet publish \
            /t:PublishContainer \
            -p DebugType=none \
            -p ContainerRegistry=ghcr.io \
            -p ContainerImageTags='"latest;${{ env.RELEASE_VERSION }}"' \
            -p ContainerRepository=${{ env.IMAGE_NAME }} \
            -bl

      - name: 📦 Upload build log
        uses: actions/upload-artifact@main
        if: always()
        with:
          name: msbuild.binlog
          path: src/ProfanityFilter.Action/msbuild.binlog

  # Runs only after the container image for this release has been published, so the
  # tag never points at an action.yml that references an image that does not exist yet.
  pin-action:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Check out the release tag
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ needs.deploy.outputs.version }}

      # action.yml on the default branch references :latest. A released tag must instead
      # reference the image published for that exact version, otherwise
      # `uses: owner/repo@<tag>` would run whatever image was pushed most recently.
      # Whatever tag the image reference currently has is replaced (:latest on the default
      # branch, or an earlier release version when the release is based on a pinned tag, for
      # example a hotfix). & and | are escaped because they are valid in tag names but have a
      # special meaning inside the sed replacement.
      - name: 📌 Pin Action image to the release version
        env:
          RELEASE_VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          escaped_version=$(printf '%s' "$RELEASE_VERSION" | sed 's/[&|]/\\&/g')
          sed -i "s|\(ghcr.io/${IMAGE_NAME}\):[^']*|\1:${escaped_version}|" action.yml
          if ! grep -qF "ghcr.io/${IMAGE_NAME}:${RELEASE_VERSION}'" action.yml; then
            echo "::error::action.yml does not reference ghcr.io/${IMAGE_NAME}:${RELEASE_VERSION} after pinning."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- action.yml; then
            git commit --message "Pin Action image to ${RELEASE_VERSION}" -- action.yml
          fi
          git tag --force --annotate "$RELEASE_VERSION" --message "Release $RELEASE_VERSION"
          git push --force origin "refs/tags/$RELEASE_VERSION"

      # Runs after pinning so the aliases point at the commit with the pinned image.
      - name: 🔖 Update Action release aliases
        if: needs.deploy.outputs.is-stable-semver == 'true'
        env:
          MAJOR_ALIAS: ${{ needs.deploy.outputs.major }}
          MINOR_ALIAS: ${{ needs.deploy.outputs.minor }}
        run: |
          git tag --force --annotate "$MAJOR_ALIAS" --message "Update $MAJOR_ALIAS Action release alias"
          git tag --force --annotate "$MINOR_ALIAS" --message "Update $MINOR_ALIAS Action release alias"
          git push --force origin "refs/tags/$MAJOR_ALIAS" "refs/tags/$MINOR_ALIAS"