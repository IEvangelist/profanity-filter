# This workflow will build and test multiple .NET projects using a matrix strategy
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build .NET

on:
  push:
    branches: [ "main" ]
    tags:
      - '**'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@main

    - name: 💜 Setup .NET
      uses: actions/setup-dotnet@main
      with:
        global-json-file: ./global.json

    - name: 🔨 Build entire solution
      run: dotnet build --configuration Release

    - name: 🔨 Build file-based AppHost
      run: dotnet build playground/apphost.cs --configuration Release

  build:
    needs: compile
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - ProfanityFilter.Action.Tests
          - ProfanityFilter.Client.Tests
          - ProfanityFilter.Services.Tests
          - ProfanityFilter.Common.Tests

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@main

    - name: 💜 Setup .NET
      uses: actions/setup-dotnet@main
      with:
        global-json-file: ./global.json

    - name: 📦 Restore dependencies
      run: dotnet restore

    - name: 🧪 Test — ${{ matrix.project }}
      run: |
        dotnet publish --configuration Release --runtime linux-x64 \
          --output "${{ runner.temp }}/${{ matrix.project }}" \
          tests/${{ matrix.project }}/

        cd "${{ runner.temp }}/${{ matrix.project }}"

        ./${{ matrix.project }}